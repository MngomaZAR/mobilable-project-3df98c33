name: CI

on:
  push:
    branches: ["main", "release/testflight-2026-06"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      audit_stores:
        description: Read existing Apple build/review state without submitting
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deployment_safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Oracle rehearsal and guarded cutover helpers
        run: python -m unittest discover -s deployment/tests -v
  apple_store_history:
    if: github.event_name == 'workflow_dispatch' && inputs.audit_stores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Apple API transport dependencies
        run: python -m pip install httpx==0.28.1 cryptography==50.0.2
      - name: Read existing Apple records using repository credentials
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          STORE_AUDIT_OUTPUT: store-audit/apple-status.json
        run: python scripts/audit-apple-store.py
      - uses: actions/upload-artifact@v4
        with:
          name: apple-store-status
          path: store-audit/apple-status.json
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BACKEND_PROVIDER: api
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:18000
      EXPO_PUBLIC_APP_ENV: qa
      EXPO_PUBLIC_STORE_TARGET: both
      EXPO_PUBLIC_DIGITAL_BILLING_PROVIDER: disabled
      EXPO_PUBLIC_DISABLE_DIGITAL_PURCHASES: "true"
      EXPO_PUBLIC_OAUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub workflow syntax and contexts
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Architecture and role boundaries
        run: |
          npm run audit:architecture
          npm run audit:dashboards
          npm run audit:single-flow
      - name: Release gate regression tests
        run: node --test scripts/tests/*.test.mjs
      - name: Compile private QA web bundle
        run: npm run build:web
      # This loopback bundle is a compiler check, never a publishable artifact.
      # Backend Images independently gates GHCR on real PostgreSQL/HTTP load tests.
