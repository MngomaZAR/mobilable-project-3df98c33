name: Deploy Backend to Dokploy

on:
  workflow_run:
    workflows: ["Build Backend Images"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      revision:
        description: Full source commit expected on the production API (defaults to the selected ref)
        type: string
        required: false

concurrency:
  group: dokploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha || inputs.revision || github.sha }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
      DOKPLOY_API_HEALTH_URL: ${{ secrets.DOKPLOY_API_HEALTH_URL }}
      DOKPLOY_API_CONTRACT_URL: ${{ secrets.DOKPLOY_API_CONTRACT_URL }}
    steps:
      - name: Check Dokploy configuration
        id: dokploy_config
        shell: bash
        run: |
          missing=()
          test -n "$DOKPLOY_URL" || missing+=("DOKPLOY_URL")
          test -n "$DOKPLOY_API_KEY" || missing+=("DOKPLOY_API_KEY")
          test -n "$DOKPLOY_COMPOSE_ID" || missing+=("DOKPLOY_COMPOSE_ID")
          test -n "$DOKPLOY_API_HEALTH_URL" || missing+=("DOKPLOY_API_HEALTH_URL")

          if [ "${#missing[@]}" -gt 0 ]; then
            message="Missing Dokploy repo secrets: ${missing[*]}"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::notice::$message; skipping automatic Dokploy redeploy."
            echo "### Production was NOT deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "$message. This run is a configuration check, not a rollout." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.dokploy_config.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.dokploy_config.outputs.configured == 'true'
        with:
          python-version: '3.12'
      - name: Validate intended production revision and endpoint configuration
        if: steps.dokploy_config.outputs.configured == 'true'
        run: >-
          python deployment/verify_backend_release.py
          --health-url "$DOKPLOY_API_HEALTH_URL"
          --contract-url "$DOKPLOY_API_CONTRACT_URL"
          --revision "$EXPECTED_REVISION" --validate-only

      - name: Trigger Dokploy compose redeploy
        if: steps.dokploy_config.outputs.configured == 'true'
        shell: bash
        run: |
          base="${DOKPLOY_URL%/}"
          curl --fail --show-error --silent --connect-timeout 10 --max-time 30 \
            --request POST "$base/api/compose.redeploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}" > /dev/null

      - name: Verify exact serving revision, schema and public capabilities
        if: steps.dokploy_config.outputs.configured == 'true'
        shell: bash
        run: |
          python deployment/verify_backend_release.py \
            --health-url "$DOKPLOY_API_HEALTH_URL" \
            --contract-url "$DOKPLOY_API_CONTRACT_URL" \
            --revision "$EXPECTED_REVISION"
          echo "Exact API revision, schema and public capabilities passed. Worker/device/settlement/store acceptance remains separate." >> "$GITHUB_STEP_SUMMARY"
