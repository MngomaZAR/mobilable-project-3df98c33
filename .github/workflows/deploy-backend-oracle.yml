name: Deploy Backend to Oracle

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit with successful CI and Backend Images runs
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    env:
      REVISION: ${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
      ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
    steps:
      - name: Require successful candidate checks
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Full lowercase commit SHA required'; exit 1; }
          runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$REVISION" -f per_page=100)
          for workflow in 'CI' 'Build Backend Images'; do
            jq -e --arg name "$workflow" --arg sha "$REVISION" \
              'any(.workflow_runs[]; .name == $name and .head_sha == $sha and .conclusion == "success")' \
              <<< "$runs" >/dev/null || { echo "No passing $workflow run for candidate"; exit 1; }
          done
          [[ "$ORACLE_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Oracle SSH user missing or invalid'; exit 1; }
          test -n "$ORACLE_SSH_PRIVATE_KEY" && test -n "$ORACLE_KNOWN_HOSTS" || { echo 'Oracle key and pinned host identity required'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve immutable candidate images
        id: images
        shell: bash
        run: |
          set -euo pipefail
          for service in api worker; do
            image="ghcr.io/mngomazar/papzi-$service"
            digest=$(docker buildx imagetools inspect "$image:$REVISION" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid image digest'; exit 1; }
            echo "$service=$image@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Rehearse and promote through Oracle release helpers
        shell: bash
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/oracle-key"
          hosts="$RUNNER_TEMP/oracle-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$hosts"
          target="$ORACLE_SSH_USER@129.151.188.15"
          options=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          stage="/tmp/papzii-candidate-$REVISION-$GITHUB_RUN_ID"
          ssh "${options[@]}" "$target" "sudo -n install -d -m 700 -o '$ORACLE_SSH_USER' '$stage'"
          scp "${options[@]}" -r deployment "$target:$stage/"
          ssh "${options[@]}" "$target" "sudo -n bash '$stage/deployment/promote-oracle-candidate.sh' '$REVISION' '$API_IMAGE' '$WORKER_IMAGE' '$stage/deployment'"
      - name: Verify public revision and schema
        shell: bash
        run: |
          set -euo pipefail
          base='https://papzii-api.129.151.188.15.nip.io'
          curl -fsS --connect-timeout 10 --max-time 30 "$base/version" | jq -e --arg sha "$REVISION" '.version == $sha'
          curl -fsS --connect-timeout 10 --max-time 30 "$base/health" | jq -e '.status == "ok"'
          echo "Backend promoted to $REVISION. Mobile and paid-service acceptance remain separate." >> "$GITHUB_STEP_SUMMARY"
