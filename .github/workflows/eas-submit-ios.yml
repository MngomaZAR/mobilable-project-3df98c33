name: EAS Submit iOS

# Submit an exact source-matched production iOS build to App Store Connect.
# Requires EXPO_TOKEN and App Store Connect setup in EAS.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Finished tested iOS EAS build ID from this source revision
        required: true
        type: string

jobs:
  submit_ios:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      STORE_BUILD_ID: ${{ inputs.build_id }}
      STORE_PLATFORM: ios
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.10.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --omit=optional

      - name: Validate release env
        run: npx eas-cli@latest env:exec production "npm run validate:env:release" --non-interactive

      - name: Verify exact artifact platform and source
        run: |
          eas build:view "$STORE_BUILD_ID" --json > "$RUNNER_TEMP/store-build.json"
          STORE_SOURCE_REVISION="$(git rev-parse HEAD)" node scripts/assert-store-build.mjs "$RUNNER_TEMP/store-build.json"
      - name: Submit the verified iOS artifact
        run: eas submit --platform ios --profile production --id "$STORE_BUILD_ID" --non-interactive
