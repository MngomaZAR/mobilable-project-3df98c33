name: EAS Submit Verified Play QA Artifact

# Submits the already-built, source-matched Android bundle after a gate fix.
# Manual dispatch can be used for a later artifact by supplying both inputs.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Finished store-signed Android EAS build ID
        required: true
        type: string
      source_revision:
        description: Git commit used to create the finished EAS build
        required: true
        type: string
  push:
    branches:
      - release/testflight-2026-06
    paths:
      - .github/workflows/eas-submit-play-qa-artifact.yml

jobs:
  submit_android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      STORE_BUILD_ID: ${{ inputs.build_id || 'bd00dc9b-07dc-49c9-adc3-1dd5b495e013' }}
      STORE_SOURCE_REVISION: ${{ inputs.source_revision || '629c3922e0beb3638a17357a72c4376a9c0c97ff' }}
      STORE_PLATFORM: android
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secret
        run: test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.10.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --omit=optional

      - name: Verify exact store artifact
        run: |
          eas build:view "$STORE_BUILD_ID" --json > "$RUNNER_TEMP/store-build.json"
          node scripts/assert-store-build.mjs "$RUNNER_TEMP/store-build.json"
          git fetch --no-tags --depth=1 origin "$STORE_SOURCE_REVISION"
          git checkout --detach "$STORE_SOURCE_REVISION"

      - name: Submit verified QA bundle to Google Play internal testing
        run: eas submit --platform android --profile beta-testing --id "$STORE_BUILD_ID" --non-interactive
