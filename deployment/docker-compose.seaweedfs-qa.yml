# Isolated S3 acceptance fixture, not an in-place MinIO data migration.
services:
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.allowDeleteBucketNotEmpty=false
      - -master.telemetry=false
      - -volume.max=4
    environment:
      AWS_ACCESS_KEY_ID: ${QA_S3_ACCESS_KEY:?Set a separate QA S3 access key}
      AWS_SECRET_ACCESS_KEY: ${QA_S3_SECRET_KEY:?Set a separate QA S3 secret}
    ports:
      - "127.0.0.1:${QA_S3_PORT:-18333}:8333"
    volumes:
      - qa-s3-data:/data
    mem_limit: 1g
    cpus: 1
volumes:
  qa-s3-data:
