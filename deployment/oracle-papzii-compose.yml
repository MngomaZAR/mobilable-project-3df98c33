x-operational-environment: &operational-environment
  ALLOW_RUNTIME_SCHEMA_CHANGES: "false"
  ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
  COMMISSION_RATE: ${COMMISSION_RATE:-0.20}
  OSRM_BASE_URL: ${OSRM_BASE_URL:-http://papzii-osrm:5000}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_SSL: ${SMTP_SSL:-false}
  RECOVERY_ENCRYPTION_KEY: ${RECOVERY_ENCRYPTION_KEY:-}
  LIVEKIT_ENABLED: ${LIVEKIT_ENABLED:-false}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: papzii-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papzii}
      POSTGRES_USER: ${POSTGRES_USER:-papzii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - papzii-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papzii} -d ${POSTGRES_DB:-papzii}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${PAPZI_API_IMAGE:?Set the tested GHCR API digest before deploying}
    container_name: papzii-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      nats:
        condition: service_started
      typesense:
        condition: service_started
    environment:
      <<: *operational-environment
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-papzii}:${POSTGRES_PASSWORD}@papzii-postgres:5432/${POSTGRES_DB:-papzii}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-papzi-media}
      NATS_URL: nats://nats:4222
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      PAYFAST_BASE_URL: ${PAYFAST_BASE_URL:-}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-true}
      PAYFAST_CHECKOUT_ENABLED: ${PAYFAST_CHECKOUT_ENABLED:-false}
      PAYFAST_RETURN_URL: ${PAYFAST_RETURN_URL:-}
      PAYFAST_CANCEL_URL: ${PAYFAST_CANCEL_URL:-}
      FINANCIAL_BANK_ENCRYPTION_KEY: ${FINANCIAL_BANK_ENCRYPTION_KEY:-}
      PAYFAST_REFUNDS_ENABLED: ${PAYFAST_REFUNDS_ENABLED:-false}
      FINANCIAL_REFUND_ACCEPTANCE_ID: ${FINANCIAL_REFUND_ACCEPTANCE_ID:-}
      STITCH_CLIENT_ID: ${STITCH_CLIENT_ID:-}
      STITCH_CLIENT_SECRET: ${STITCH_CLIENT_SECRET:-}
      STITCH_WEBHOOK_SECRET: ${STITCH_WEBHOOK_SECRET:-}
      STITCH_MODE: ${STITCH_MODE:-}
      STITCH_PAYOUTS_ENABLED: ${STITCH_PAYOUTS_ENABLED:-false}
      FINANCIAL_PAYOUT_ACCEPTANCE_ID: ${FINANCIAL_PAYOUT_ACCEPTANCE_ID:-}
    expose:
      - "8000"
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: ${PAPZI_WORKER_IMAGE:?Set the tested GHCR worker digest before deploying}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *operational-environment
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-papzii}:${POSTGRES_PASSWORD}@papzii-postgres:5432/${POSTGRES_DB:-papzii}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NATS_URL: nats://nats:4222
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}

  minio:
    # Existing volume stays intact until a verified S3 data migration is accepted.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - papzii-minio-data:/data

  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - papzii-nats-data:/data

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
    volumes:
      - papzii-typesense-data:/data

volumes:
  papzii-postgres-data:
  papzii-minio-data:
  papzii-nats-data:
  papzii-typesense-data:

networks:
  dokploy-network:
    external: true
