services:
  postgres:
    image: postgres:16-alpine
    container_name: papzii-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papzii}
      POSTGRES_USER: ${POSTGRES_USER:-papzii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - papzii-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papzii} -d ${POSTGRES_DB:-papzii}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ${PAPZII_SOURCE_DIR:-/opt/papzii-src}
      dockerfile: backend/api/Dockerfile
    image: papzii-api:local
    container_name: papzii-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      nats:
        condition: service_started
      typesense:
        condition: service_started
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-papzii}:${POSTGRES_PASSWORD}@papzii-postgres:5432/${POSTGRES_DB:-papzii}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-papzi-media}
      NATS_URL: nats://nats:4222
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      PAYFAST_BASE_URL: ${PAYFAST_BASE_URL:-}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
    expose:
      - "8000"
    networks:
      - default
      - madabukela_default
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ${PAPZII_SOURCE_DIR:-/opt/papzii-src}
      dockerfile: backend/worker/Dockerfile
    image: papzii-worker:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-papzii}:${POSTGRES_PASSWORD}@papzii-postgres:5432/${POSTGRES_DB:-papzii}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      NATS_URL: nats://nats:4222
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - papzii-minio-data:/data

  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    command: ["-js"]
    volumes:
      - papzii-nats-data:/data

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
    volumes:
      - papzii-typesense-data:/data

volumes:
  papzii-postgres-data:
  papzii-minio-data:
  papzii-nats-data:
  papzii-typesense-data:

networks:
  madabukela_default:
    external: true
